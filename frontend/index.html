<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f8f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d0e" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pédiluve</title>
    <script>
      // Applies the theme before first paint, so a dark-mode visitor never
      // sees a white flash. Same rules as src/lib/theme.ts (keep the storage
      // key in sync): an explicit choice wins, otherwise follow the OS.
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('pediluve-theme')
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
